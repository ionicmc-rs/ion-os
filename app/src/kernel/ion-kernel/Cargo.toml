[package]
name = "ion-kernel"
version = "0.1.0"
edition = "2024"



[lib]
test = true
bench = false
crate-type = ["staticlib"]


[dependencies]
volatile = "0.2.6"
spin = "0.5.2"
cfg-if = "*"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10.5"
bitflags = "*"
elf = { version = "*", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.4" }

[dependencies.crossbeam-queue]
version = "*"
default-features = false
features = ["alloc"]

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[features]
default = ["test"]
test = []