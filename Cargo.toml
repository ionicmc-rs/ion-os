[package]
name = "ion-kernel"
version = "0.1.0"
edition = "2021"

[lib]
path = "app/src/kernel/ion-kernel/src/lib.rs"
test = false
bench = false
crate-type = ["staticlib"]


[dependencies]
volatile = "0.2.6"
spin = "0.5.2"
cfg-if = "*"
x86_64 = "*"
uart_16550 = "0.2.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.10.5"
[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[features]
default = ["test"]
test = []